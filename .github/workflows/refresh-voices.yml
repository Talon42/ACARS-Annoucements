name: Refresh Edge Voices

on:
  workflow_dispatch:
  schedule:
    - cron: "25 10 * * 1"
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-voices.yml
      - tools/update_voices.py

permissions:
  contents: write

concurrency:
  group: refresh-edge-voices
  cancel-in-progress: false

jobs:
  refresh:
    name: Download the current voice catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Edge TTS
        run: python -m pip install -r requirements.txt
      - name: Update JSON and Markdown voice catalogs
        run: python tools/update_voices.py
      - name: Commit changed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- voices.json VOICES.md
          if git diff --cached --quiet; then
            echo "Voice catalog is already current."
          else
            git commit -m "Refresh Edge TTS voice catalog"
            git push origin HEAD:main
          fi
