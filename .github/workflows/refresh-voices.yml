name: Refresh TTS Voices

on:
  workflow_dispatch:
  schedule:
    - cron: "25 10 * * 1"
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-voices.yml
      - tools/update_voices.py

permissions:
  contents: write

concurrency:
  group: acars-audio-pipeline-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Download current Edge and Kokoro voice catalogs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install TTS dependencies
        run: python -m pip install -r requirements.txt
      - name: Update both engines in JSON and Markdown catalogs
        run: python tools/update_voices.py
      - name: Commit changed catalog to the selected branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- voices.json VOICES.md
          if git diff --cached --quiet; then
            echo "Voice catalog is already current."
          else
            git commit -m "Refresh Edge and Kokoro TTS voice catalogs"
            git push origin "HEAD:$TARGET_BRANCH"
          fi

