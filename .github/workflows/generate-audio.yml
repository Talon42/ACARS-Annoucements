name: Generate ACARS Audio

on:
  push:
    branches: [main]
    paths:
      - templates.json
      - config.json
      - tools/generate_audio.py
      - .github/workflows/generate-audio.yml
  pull_request:
    paths:
      - templates.json
      - config.json
      - tools/generate_audio.py
      - .github/workflows/generate-audio.yml
  workflow_dispatch:

permissions:
  contents: write

# Serialize generation with final-release publishing so releases cannot
# accidentally capture a partially updated audio library.
concurrency:
  group: acars-audio-pipeline
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    name: Generate and commit MP3s
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install FFmpeg and Edge TTS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -r requirements.txt
      - name: Validate announcement templates
        run: python tools/generate_audio.py --validate
      - name: Generate and package audio
        run: python tools/generate_audio.py
      - name: Upload preview ZIP
        uses: actions/upload-artifact@v7
        with:
          name: acars-announcements-audio
          path: dist/ACARS-Announcements-audio.zip
          if-no-files-found: error
          retention-days: 30
      - name: Update repository /audio directory
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          # /audio is fully managed by the generator, including its manifest.
          rm -rf audio
          cp -a dist/audio audio
          test -s audio/manifest.json
          test "$(find audio -maxdepth 1 -type f -iname '*.mp3' | wc -l)" -gt 0
          git add --all -- audio
          if git diff --cached --quiet; then
            echo 'Generated MP3s are unchanged; no commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update generated ACARS announcement audio'
          # Deliberately do not force-push or rebase a potentially stale build.
          git push origin HEAD:main
