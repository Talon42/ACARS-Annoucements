name: Generate ACARS Audio

on:
  push:
    branches: [main]
    paths:
      - templates.json
      - config.json
      - tools/generate_audio.py
      - .github/workflows/generate-audio.yml
  pull_request:
    paths:
      - templates.json
      - config.json
      - tools/generate_audio.py
      - .github/workflows/generate-audio.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag (example: v1.0.0); blank means artifact only"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: audio-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Validate, synthesize, and package MP3s
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install FFmpeg and Edge TTS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -r requirements.txt
      - name: Validate announcement templates
        run: python tools/generate_audio.py --validate
      - name: Generate and package audio
        run: python tools/generate_audio.py
      - name: Upload downloadable audio ZIP
        uses: actions/upload-artifact@v7
        with:
          name: acars-announcements-audio
          path: dist/ACARS-Announcements-audio.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish versioned GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must look like v1.0.0" >&2
            exit 1
          fi
          archive="dist/ACARS-Announcements-audio.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$archive" --clobber
          else
            gh release create "$RELEASE_TAG" "$archive" \
              --target "$GITHUB_SHA" \
              --title "ACARS Announcements $RELEASE_TAG" \
              --notes "Generated Edge neural voice announcement pack, including manifest.json."
          fi
